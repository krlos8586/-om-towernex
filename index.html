<title>TOWERNEX / LPS O&amp;M · Acceso</title>
<style>
:root{--bg:#eef1f3;--panel:#fff;--ink:#1d2326;--muted:#5d686d;--line:#d6dbd9;--band:#1b3245;--teal:#22d3c5;--accent:#d9480f;--red:#c92a2a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);padding:16px}
.box{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.top{background:linear-gradient(100deg,#1b3245,#14283a);padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top img{height:40px;width:auto}
form{padding:22px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:20px} p{margin:0;color:var(--muted);font-size:13.5px}
label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);width:100%}
input:focus{outline:2px solid var(--teal);outline-offset:1px}
button{font:inherit;font-weight:600;padding:11px;border:0;background:var(--band);color:#fff;cursor:pointer}
button:hover{background:var(--accent)} button[disabled]{opacity:.6;cursor:wait}
#err{color:var(--red);font-size:13.5px;min-height:1.2em}
.chk{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:13.5px} .chk input{width:auto}

body{background:#0b1622;position:relative;overflow-x:hidden}
.map{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.map .grat line{stroke:#22d3c5;stroke-opacity:.06;stroke-width:1}
.map .nb path{fill:#12222f;stroke:#22d3c5;stroke-opacity:.12;stroke-width:1}
.map .col{fill:url(#land);stroke:#22d3c5;stroke-width:1.6;stroke-opacity:.75}
.map .col-glow{fill:none;stroke:#22d3c5;stroke-width:8;stroke-opacity:.25}
.map .sea{fill:#22d3c5;fill-opacity:.22;font:600 13px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.4em}
.map .bm-b{fill:none;stroke:#22d3c5;stroke-opacity:.14;stroke-width:1.2}
.map .bm{fill:none;stroke:#7ff6ec;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:14 86;animation:beam linear infinite}
.map .cl-b{fill:none;stroke:#ffb36b;stroke-opacity:.25;stroke-width:1.2}
.map .cl{fill:none;stroke:#ffcf99;stroke-width:2;stroke-linecap:round;stroke-dasharray:10 90;animation:beam 2.6s linear infinite}
.map .hub{fill:#22d3c5}
.map .cn{fill:#ffd9a8}
.map .ring{fill:none;stroke:#ffb36b;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
.map .lab text{fill:#e8eef2;fill-opacity:.85;font:500 12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em}
@keyframes beam{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(4);opacity:0}}
@media (prefers-reduced-motion:reduce){.map .bm,.map .cl,.map .ring{animation:none}}
.box{position:relative;z-index:1;background:rgba(255,255,255,.96);backdrop-filter:blur(4px);box-shadow:0 18px 50px rgba(0,0,0,.45);border-color:rgba(34,211,197,.35)}
@media (min-width:900px){body{place-items:center start;padding-left:7vw}}
@media (max-width:899px){.map{height:40vh;bottom:auto;top:8px}body{place-items:start center;padding-top:calc(40vh + 8px);padding-bottom:60px}}
.tag{position:fixed;left:7vw;bottom:24px;z-index:1;color:#9fb3c2;font:500 11px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}
.tag b{color:#22d3c5;font-weight:500}
@media (max-width:899px){.tag{left:16px;right:16px;bottom:12px;text-align:center}}

.tag{display:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.stage{position:relative;z-index:1;display:flex;flex-direction:column;gap:26px;width:min(440px,100%)}
.hero{color:#e8eef2;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.hero .eyebrow{font:500 11.5px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;color:#22d3c5}
.hero h2{margin:8px 0 10px;font-size:clamp(32px,4.4vw,46px);line-height:1.02;font-weight:800;letter-spacing:-.01em}
.hero h2 span{background:linear-gradient(90deg,#7ff6ec,#22d3c5 45%,#5aa9ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(34,211,197,.35))}
.hero p{margin:0;color:#b9c9d6;font-size:15px;line-height:1.5;max-width:40ch}
.feats{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.feats li{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#d6e3ec;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(127,246,236,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 16px -8px rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.feats i{font-style:normal;color:#22d3c5}
.box{width:100%;border-radius:22px;overflow:hidden;border:0;
 background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(234,242,247,.93));
 -webkit-mask-image:linear-gradient(to right,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%),linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
 -webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%),linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);mask-composite:intersect}
.top{padding-top:26px!important}
form{padding-bottom:30px!important}
.top{position:relative;padding:18px 22px;background:linear-gradient(135deg,#24496a 0%,#1b3245 45%,#0f2233 100%);border-bottom:1px solid rgba(34,211,197,.45)}
.top::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0));pointer-events:none}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,#22d3c5,transparent);opacity:.8}
.top img{position:relative;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
form{padding:24px 24px 22px;gap:13px}
h1{font-size:20px;color:#14283a;letter-spacing:-.005em}
label{color:#4d5f6b}
input:not([type=checkbox]){border-radius:9px;border:1px solid #c9d4dc;background:#f6f9fb;padding:11px 13px;box-shadow:inset 0 2px 3px rgba(20,40,58,.08),0 1px 0 rgba(255,255,255,.9);transition:border-color .15s,box-shadow .15s,background .15s}
input:not([type=checkbox]):focus{outline:none;background:#fff;border-color:#22d3c5;box-shadow:inset 0 1px 2px rgba(20,40,58,.06),0 0 0 3px rgba(34,211,197,.25)}
button#b{border-radius:10px;padding:12px;font-size:15px;letter-spacing:.02em;background:linear-gradient(180deg,#2b587f 0%,#1b3245 55%,#132638 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -2px 0 rgba(0,0,0,.25),0 8px 18px -6px rgba(15,34,51,.7);transition:transform .12s,box-shadow .12s,filter .12s}
button#b:hover{background:linear-gradient(180deg,#f26b2a 0%,#d9480f 60%,#b83a0b 100%);filter:saturate(1.05)}
button#b:active{transform:translateY(1px);box-shadow:inset 0 2px 5px rgba(0,0,0,.35)}
@media (min-width:900px){body{place-items:center start;padding-left:7vw}}
@media (max-width:899px){.hero{text-align:center}.hero p{margin:0 auto}.feats{justify-content:center}.stage{gap:18px}}

.map .tower .tw-leg{fill:none;stroke:#7ff6ec;stroke-width:1.6;stroke-linecap:round}
.map .tower .tw-br{fill:none;stroke:#22d3c5;stroke-opacity:.75;stroke-width:.8}
.map .tower .tw-pl{stroke:#7ff6ec;stroke-width:1.4}
.map .tower .tw-ant{fill:#12222f;stroke:#7ff6ec;stroke-width:.9}
.map .tower .tw-dish{fill:#12222f;stroke:#7ff6ec;stroke-width:.9}
.map .tower .tw-led{fill:#ff5a3c;animation:led 1.6s steps(2,jump-none) infinite}
.map .tower .tw-ground{fill:#22d3c5;fill-opacity:.18;filter:url(#gl2)}
.map .tower .tw-wave{fill:none;stroke:#7ff6ec;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:wave 3.3s ease-out infinite}
.map .lab .mde{fill:#7ff6ec;fill-opacity:1;font-weight:700;letter-spacing:.1em}
.map .ghost{opacity:.22}
.map .ghost .tw-leg{stroke-width:3}.map .ghost .tw-br{stroke-width:1.4}.map .ghost .tw-pl{stroke-width:2.4}.map .ghost .tw-ant,.map .ghost .tw-dish{stroke-width:1.6}
.map .ghost .tw-led{opacity:1}.map .ghost .tw-wave{stroke-width:2;animation-duration:4.6s}
@media (max-width:899px){.map .ghost{display:none}}
.hero h2{margin:10px 0 4px;white-space:nowrap;font-size:clamp(30px,4vw,44px)}
.hero h2 span{margin-left:.15em}
.hero .feats{margin-top:14px}
.stage{gap:22px}
@keyframes led{0%{opacity:1}100%{opacity:.15}}
@keyframes wave{0%{transform:scale(1);opacity:.85}100%{transform:scale(6);opacity:0}}
@media (prefers-reduced-motion:reduce){.map .tower .tw-led,.map .tower .tw-wave{animation:none}}
</style>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function sha(t){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function openWith(P){const k=await crypto.subtle.importKey('raw',ub(P.k),'AES-GCM',false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.iv)},k,ub(D.ct)); let html=new TextDecoder().decode(pt); const U=JSON.stringify({name:P.name,role:P.role,email:P.email}).replace(/</g,'\u003c'); const A=JSON.stringify(P.api||null).replace(/</g,'\u003c'); html=html.replace('<head>','<head><script>window.OM_USER='+U+';window.OM_API='+A+';window.OM_CK='+JSON.stringify(P.ck||null)+';<\/script>');
 const fr=document.createElement('iframe'); fr.setAttribute('allow','clipboard-write'); fr.title='Hub O&M LPS/TOWERNEX';
 fr.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f4f2';
 document.body.innerHTML=''; document.body.style.cssText='margin:0;padding:0;display:block;min-height:0';
 document.body.appendChild(fr); fr.srcdoc=html; document.title='O&M LPS/TOWERNEX';}
async function login(u,p){const h=await sha(u.trim().toLowerCase()); const e=D.e.find(x=>x.u===h); if(!e) throw 0;
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
 const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(e.s),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(e.i)},kek,ub(e.k))));}
window.addEventListener('message',ev=>{ if(ev.data==='om-logout'){ try{localStorage.removeItem('om-k');sessionStorage.removeItem('om-k');}catch(_){} location.reload(); } });
window.addEventListener('DOMContentLoaded',async()=>{let s=null;try{s=localStorage.getItem('om-k')||sessionStorage.getItem('om-k');}catch(_){} if(s){try{await openWith(JSON.parse(s));return;}catch(_){try{localStorage.removeItem('om-k');sessionStorage.removeItem('om-k');}catch(__){}}}});
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const b=document.getElementById('b'),er=document.getElementById('err');b.disabled=true;b.textContent='Verificando…';er.textContent='';
 try{const raw=await login(document.getElementById('u').value,document.getElementById('p').value);
  try{(document.getElementById('r').checked?localStorage:sessionStorage).setItem('om-k',JSON.stringify(raw));}catch(_){}
  await openWith(raw);}catch(_){er.textContent='Correo o contraseña incorrectos.';b.disabled=false;b.textContent='Entrar';}});
})();
